name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで走っている古いジョブは止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # workspace に apps/desktop/src-tauri が入っているので、Linux でも WebKitGTK が要る。
      # 配布バンドルは Windows でだけ作るが、コンパイルは両 OS で通しておく。
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier
        run: pnpm format:check

      - name: tsc --noEmit
        run: pnpm tsc --noEmit

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

  # Tauri の実バンドルは Windows でのみ作る（配布対象が Windows のため）
  tauri-build:
    name: Tauri bundle (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: tauri

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: tauri build
        run: pnpm tauri build --no-bundle
        working-directory: apps/desktop
