[workspace]
resolver = "2"
members = [
    "crates/mailcore",
    "crates/mailstore",
    "crates/mailsync",
    "crates/mailmcp",
    "crates/mailcli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/icethink/meowbox"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
futures = "0.3.34"
keyring = "4.2.0"
